services:
  library_frontend:
    container_name: library_frontend
    build:
      context: ../
      dockerfile: dev.Dockerfile
    restart: always
    volumes:
      - ../:/app/
    command:
      [
        "/bin/sh",
        "-c",
        "npm install --legacy-peer-deps && ng serve --host 0.0.0.0 --port 4210 --allowed-hosts=true"
      ]
    ports:
      - 4210:4210

  library_mongo:
    environment:
      - "TZ=America/Mexico_City"
    container_name: library_mongo
    image: mongo:5.0.0-rc3-focal
    restart: always
    ports:
      - 27018:27017
    volumes:
      - ../data/mongo/data:/data/db

  library_back:
    container_name: library_back
    build:
      context: https://github.com/Ulises-Hdz/library_back.git#main
      dockerfile: dev.Dockerfile
    restart: always
    environment:
      - PORT=${BACK_PORT:-3000}
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET:?Falta JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-2h}
    depends_on:
      - library_mongo
    command: ["npm", "run", "start:dev"]
    ports:
      - 3000:3000
