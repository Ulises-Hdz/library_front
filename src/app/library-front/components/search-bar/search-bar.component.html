<form [formGroup]="filtersForm" class="space-y-5">
  <div class="relative mx-auto mb-8 flex w-full max-w-4xl items-center rounded-full bg-white p-1.5 shadow-2xl transition-all focus-within:ring-4 focus-within:ring-[#14B8A6]/40">
    <div class="pointer-events-none flex items-center pl-4 pr-2">
      <svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 1 1-14 0 7 7 0 0 1 14 0z"></path>
      </svg>
    </div>
    <select
      formControlName="searchBy"
      class="cursor-pointer appearance-none border-none bg-transparent pr-4 text-sm font-medium text-slate-600 outline-none hover:text-[#1E40AF] focus:ring-0"
      aria-label="Buscar por campo"
    >
      <option value="title">Título</option>
      <option value="author">Autor</option>
      <option value="category">Categoría</option>
    </select>
    <div class="mx-2 hidden h-6 w-px bg-slate-300 sm:block"></div>
    <input
      formControlName="search"
      type="search"
      class="w-full min-w-0 flex-1 border-none bg-transparent px-3 py-3 text-base text-slate-800 outline-none placeholder:text-slate-400 focus:ring-0"
      placeholder="Escribe tu búsqueda..."
      aria-label="Texto de búsqueda"
    />
    <button
      type="button"
      class="px-4 text-sm font-medium text-slate-400 outline-none transition-colors hover:text-red-500"
      (click)="clearFilters()"
    >
      Limpiar
    </button>
  </div>

</form>
