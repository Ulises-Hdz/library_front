<!-- BOTÓN FLOTANTE: Siempre visible para abrir el menú -->
<div class="fixed top-6 left-6 z-40">
  <button
    (click)="toggleMenu()"
    aria-label="Abrir menú"
    class="bg-neutral text-white hover:bg-slate-800 p-2 rounded-full shadow-md transition-colors focus:outline-none">
    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
    </svg>
  </button>
</div>

<!-- CAPA OSCURA (OVERLAY): Oscurece el fondo y cierra el menú al hacer clic fuera -->
@if (isMenuOpen()) {
  <div
    (click)="toggleMenu()"
    class="fixed inset-0 bg-black/60 z-40 transition-opacity backdrop-blur-sm cursor-pointer">
  </div>
}

<!-- PANEL DEL MENÚ LATERAL -->
<aside
  class="fixed top-0 left-0 h-screen w-72 bg-[#0F172A] shadow-2xl z-50 transform transition-transform duration-300 ease-in-out flex flex-col"
  [class.translate-x-0]="isMenuOpen()"
  [class.-translate-x-full]="!isMenuOpen()"
  [attr.aria-hidden]="!isMenuOpen()">

  <!-- Cabecera del Menú -->
  <div class="flex items-center justify-between p-6 border-b border-slate-700/50">
    <div class="flex flex-col">
      <h2 class="text-white font-bold text-lg leading-tight">TecMM Tepatitlán</h2>
      <span class="text-[#14B8A6] text-xs font-semibold">Biblioteca Digital</span>
    </div>
    <!-- Botón para cerrar (X) -->
    <button (click)="toggleMenu()" class="text-slate-400 hover:text-white p-2 hover:bg-slate-800 rounded-full transition">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
  </div>

  <!-- Enlaces de Navegación -->
  <nav class="flex-1 p-4 flex flex-col gap-2 mt-2">

    <a routerLink="/home" routerLinkActive="!bg-[#1E40AF] !text-white !shadow-md"
       class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg transition font-medium">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="size-4">
        <path d="M8.543 2.232a.75.75 0 0 0-1.085 0l-5.25 5.5A.75.75 0 0 0 2.75 9H4v4a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-1a1 1 0 1 1 2 0v1a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1V9h1.25a.75.75 0 0 0 .543-1.268l-5.25-5.5Z" />
      </svg>
      Inicio
    </a>

    <a routerLink="/books" routerLinkActive="!bg-[#1E40AF] !text-white !shadow-md"
       class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg transition font-medium">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="size-4">
        <path d="M7.25 3.688a8.035 8.035 0 0 0-4.872-.523A.48.48 0 0 0 2 3.64v7.994c0 .345.342.588.679.512a6.02 6.02 0 0 1 4.571.81V3.688ZM8.75 12.956a6.02 6.02 0 0 1 4.571-.81c.337.075.679-.167.679-.512V3.64a.48.48 0 0 0-.378-.475 8.034 8.034 0 0 0-4.872.523v9.268Z" />
      </svg>
      Catálogo de Libros
    </a>

    <a routerLink="/loans" routerLinkActive="!bg-[#1E40AF] !text-white !shadow-md"
       class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg transition font-medium">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
      </svg>
      Mis Préstamos
    </a>

  </nav>

  <!-- Botón Cerrar Sesión al fondo -->
  <div class="p-6 border-t border-slate-700/50">
    @if(authService.authStatus() === 'authenticated') {
      <button (click)="logout()" class="w-full text-slate-400 hover:text-red-400 text-sm font-medium transition flex items-center justify-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
        </svg>
        Cerrar Sesión
      </button>
    } @else if (authService.authStatus() === 'not-authenticated') {
      <button type="button" (click)="logout()" class="btn btn-primary">Iniciar Sesión</button>
    }
  </div>
</aside>
