<header class="bg-neutral w-full pt-20 pb-12 px-4 md:px-8 shadow-md">
  <div class="max-w-3xl mx-auto text-center">
    <h1 class="text-neutral-content text-2xl md:text-3xl font-bold mb-6">
      ¿Qué libro estás buscando hoy?
    </h1>
    <app-search-bar (filtersChanged)="updateFilters($event)" />
  </div>
</header>
<section class="max-w-7xl mx-auto p-4 md:p-8 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
  @for (book of books(); track book._id) {
    <app-book-card [book]="book" />
  } @empty {
    <p class="col-span-full text-center text-slate-500">No se encontraron libros.</p>
  }
</section>
