<div class="flex items-start justify-between gap-4 border-b border-base-300 p-5">
  <div>
    <h2 class="text-xl font-bold" id="book-dialog-title">{{ book.title }}</h2>
    <p class="mt-1 text-sm text-base-content/70">{{ book.author }}</p>
  </div>
  <button type="button" class="btn btn-circle btn-ghost btn-sm" aria-label="Cerrar detalles" (click)="close()">
    <span aria-hidden="true">✕</span>
  </button>
</div>

<div class="grid max-h-[70vh] grid-cols-1 gap-6 overflow-y-auto p-5 sm:grid-cols-[minmax(0,2fr)_minmax(0,3fr)]">
  @if (book.coverUrl) {
    <img class="mx-auto max-h-80 w-full rounded-lg object-contain" [src]="book.coverUrl" [alt]="'Portada de ' + book.title" />
  } @else {
    <div class="flex min-h-48 items-center justify-center rounded-lg bg-base-200 text-sm text-base-content/60">
      Sin portada disponible
    </div>
  }

  <div class="space-y-4">
    <p class="text-sm leading-relaxed">{{ book.description || 'Sin descripción disponible.' }}</p>
    <dl class="space-y-2 text-sm">
      <div>
        <dt class="font-semibold">Categoría</dt>
        <dd>{{ book.categories }}</dd>
      </div>
      <div>
        <dt class="font-semibold">ISBN</dt>
        <dd>{{ book.isbn }}</dd>
      </div>
      <div>
        <dt class="font-semibold">Editorial</dt>
        <dd>{{ book.publisher }}</dd>
      </div>
      <div>
        <dt class="font-semibold">Año de publicación</dt>
        <dd>{{ book.publicationYear }}</dd>
      </div>
    </dl>
  </div>
</div>

<div class="flex justify-end border-t border-base-300 p-5">
  <button type="button" class="btn btn-primary" (click)="close()">Cerrar</button>
</div>
