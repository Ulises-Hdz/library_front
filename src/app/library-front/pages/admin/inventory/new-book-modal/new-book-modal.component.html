<div class="fixed inset-0 z-[60] bg-black/60 flex items-center justify-center p-4">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden">
    <header class="flex items-center justify-between px-6 py-4 border-b border-slate-200 select-none">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-blue-50 text-blue-700 flex items-center justify-center">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
        </div>
        <div>
          <h2 class="text-lg font-bold text-slate-800 leading-tight">{{ book() ? 'Editar Libro' : 'Registrar Nuevo Libro' }}</h2>
          @if (!book()) {
            <span class="text-xs text-slate-500">Paso {{ step() }} de 2</span>
          }
        </div>
      </div>
      <button type="button" aria-label="Cerrar" class="p-2 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition-colors" [disabled]="saving()" (click)="closed.emit()">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </header>

    <div class="p-6">
    @if (step() === 1) {
      <div class="grid grid-cols-2 gap-4">
        <div class="flex flex-col">
          <label class="form-label" [class.text-red-500]="showIsbnError()">ISBN *</label>
          <input class="form-input" [class.border-red-500]="showIsbnError()" [value]="isbn()" (input)="isbn.set($any($event.target).value)" (blur)="onIsbnBlur()" />
        </div>
        <div class="flex flex-col">
          <label class="form-label" [class.text-red-500]="showPublisherError()">Editorial *</label>
          <input class="form-input" [class.border-red-500]="showPublisherError()" [value]="publisher()" (input)="publisher.set($any($event.target).value)" (blur)="onPublisherBlur()" />
        </div>
        <div class="flex flex-col col-span-2">
          <label class="form-label" [class.text-red-500]="showTitleError()">Título *</label>
          <input class="form-input" [class.border-red-500]="showTitleError()" [value]="title()" (input)="title.set($any($event.target).value)" (blur)="onTitleBlur()" />
        </div>
        <div class="flex flex-col">
          <label class="form-label" [class.text-red-500]="showAuthorError()">Autor *</label>
          <input class="form-input" [class.border-red-500]="showAuthorError()" [value]="author()" (input)="author.set($any($event.target).value)" (blur)="onAuthorBlur()" />
        </div>
        <div class="flex flex-col">
          <label class="form-label" [class.text-red-500]="showCategoriesError()">Categorías *</label>
          <input class="form-input" placeholder="Separadas por coma" [class.border-red-500]="showCategoriesError()" [value]="categories()" (input)="categories.set($any($event.target).value)" (blur)="onCategoriesBlur()" />
        </div>
        <div class="flex flex-col col-span-2">
          <label class="form-label">Sinopsis</label>
          <textarea class="form-input" rows="3" [value]="description()" (input)="description.set($any($event.target).value)"></textarea>
        </div>
      </div>
      @if (book() && error()) {
        <p class="text-red-600 text-sm mt-3">{{ error() }}</p>
      }
      <div class="flex justify-end gap-2 mt-6">
        <button class="btn btn-ghost" (click)="closed.emit()" [disabled]="saving()">Cancelar</button>
        @if (book()) {
          <button class="btn btn-primary" [disabled]="!step1Valid() || saving()" (click)="update()">
            {{ saving() ? 'Guardando...' : 'Guardar cambios' }}
          </button>
        } @else {
          <button class="btn btn-primary" [disabled]="!step1Valid()" (click)="step.set(2)">Siguiente</button>
        }
      </div>
    } @else {
      <span class="block text-sm font-semibold text-slate-700 mb-3">Formato del Recurso</span>
      <div class="flex p-1 bg-slate-100 rounded-lg mb-6 w-full sm:w-2/3">
        <button type="button" class="flex-1 py-2 text-sm font-semibold rounded-md transition-all"
          [class.bg-white]="isDigital()" [class.shadow-sm]="isDigital()" [class.text-blue-700]="isDigital()"
          [class.text-slate-500]="!isDigital()"
          (click)="isDigital.set(true)">Digital (PDF)</button>
        <button type="button" class="flex-1 py-2 text-sm font-semibold rounded-md transition-all"
          [class.bg-white]="!isDigital()" [class.shadow-sm]="!isDigital()" [class.text-blue-700]="!isDigital()"
          [class.text-slate-500]="isDigital()"
          (click)="isDigital.set(false)">Físico (Inventario)</button>
      </div>

      @if (isDigital()) {
        <label
          class="group flex flex-col items-center justify-center border-2 border-dashed border-blue-300 bg-blue-50/50 hover:bg-blue-50 rounded-xl p-8 text-center cursor-pointer transition-colors"
          [class.border-[#1E40AF]]="dragging()"
          [class.bg-blue-100]="dragging()"
          (dragover)="$event.preventDefault(); dragging.set(true)"
          (dragleave)="dragging.set(false)"
          (drop)="onDrop($event)">
          <div class="w-14 h-14 bg-white rounded-full flex items-center justify-center shadow-sm mb-4 group-hover:scale-110 transition-transform">
            <svg class="w-7 h-7 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
          </div>
          <p class="text-sm font-semibold text-blue-900 mb-1">
            {{ file() ? file()!.name : 'Haz clic para subir un archivo o arrástralo aquí' }}
          </p>
          <p class="text-xs text-slate-500">Solo archivos PDF o EPUB (Máx. 50MB)</p>
          <input type="file" accept=".pdf,.epub" class="hidden" (change)="onFileInput($event)" />
        </label>
      } @else {
        <div class="flex flex-col">
          <label class="form-label">¿Cuántos ejemplares llegaron?</label>
          <input type="number" min="1" class="form-input" [value]="copies()" (input)="copies.set(+$any($event.target).value)" />
        </div>
      }

      @if (error()) {
        <p class="text-red-600 text-sm mt-3">{{ error() }}</p>
      }

      <div class="flex justify-between mt-6">
        <button class="btn btn-ghost" (click)="step.set(1)" [disabled]="saving()">Atrás</button>
        <div class="flex gap-2">
          <button class="btn btn-ghost" (click)="closed.emit()" [disabled]="saving()">Cancelar</button>
          <button class="btn btn-success" [disabled]="!canSave() || saving()" (click)="save()">Guardar</button>
        </div>
      </div>
    }
    </div>
  </div>
</div>
