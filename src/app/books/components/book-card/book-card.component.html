<div class="card bg-base-100 w-full h-full shadow-sm">
  <figure class="aspect-[3/4] bg-base-200">
    <img
      class="w-full h-full object-cover"
      [src]="book().coverUrl"
      [alt]="book().title" />
  </figure>
  <div class="card-body">
    <h2 class="card-title">{{ book().title }}</h2>
    <p class="text-sm text-slate-500">{{ book().author }}</p>
    <p class="line-clamp-3">{{ book().description }}</p>
    <div class="card-actions justify-end">
      <button class="btn btn-primary" type="button" (click)="openDetails()">Ver detalle</button>
    </div>
  </div>
</div>
