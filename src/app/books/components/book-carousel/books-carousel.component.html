<section class="px-4 md:px-8">
  <h2 class="text-2xl font-bold mb-4">Libros disponibles</h2>

  @if (books().length) {
    <div class="carousel carousel-center rounded-box w-full space-x-4 p-2 bg-base-200">
      @for (book of books(); track book._id) {
        <button type="button" class="carousel-item flex-col w-40 md:w-48 text-left cursor-pointer" (click)="openDetails(book)">
          <img
            class="aspect-[3/4] w-full object-cover rounded-box shadow"
            [src]="book.coverUrl"
            [alt]="book.title" />
          <span class="mt-2 text-sm font-medium line-clamp-2">{{ book.title }}</span>
        </button>
      }
    </div>
  } @else {
    <p class="text-slate-500">No hay libros disponibles por el momento.</p>
  }
</section>
