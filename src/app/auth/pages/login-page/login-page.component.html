<div class="flex min-h-screen w-full bg-white">
  

  <div class="hidden lg:flex lg:w-1/2 relative bg-[#0F172A] items-center justify-center overflow-hidden">
    <img src="assets/images/tjs.jpeg" alt="TecMM Tepatitlán" class="absolute inset-0 w-full h-full object-cover">
    <div class="absolute inset-0 bg-[#0F172A]/40"></div>
  </div>

  <div class="w-full lg:w-1/2 flex items-center justify-center p-4 sm:p-12 xl:p-24 bg-slate-50">
    
    <div class="w-full max-w-md">
      <div class="text-center mb-10">
        <h2 class="text-3xl font-extrabold text-slate-800">Bienvenido de nuevo</h2>
        <p class="text-slate-500 mt-2">Por favor, ingresa a tu cuenta</p>
      </div>

      <form class="space-y-5" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Correo</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="fa-regular fa-envelope text-slate-400"></i>
            </div>
            <input 
              type="text" 
              formControlName="email"
              required
              placeholder="Ej. correo@dominio.com" 
              class="w-full pl-10 pr-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#1E40AF] focus:border-[#1E40AF] outline-none transition-colors">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="fa-solid fa-lock text-slate-400"></i>
            </div>
            <input 
              type="password"
              formControlName="password"
              placeholder="••••••••" 
              class="w-full pl-10 pr-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#1E40AF] focus:border-[#1E40AF] outline-none transition-colors">
          </div>
        </div>

        <div>
          <button type="submit" class="btn btn-primary w-full justify-center">
            Iniciar Sesión
          </button>
        </div>

        <p class="text-center text-sm text-gray-500">
          ¿No tienes una cuenta? <a routerLink="/auth/register" class="text-primary">Regístrate</a>
        </p>
        
      </form>
      @if (hasError) {
      <div role="alert" class="alert alert-error animate-premium-in fixed bottom-5 right-5 left-5 sm:left-auto sm:w-72">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>Por favor revise la información ingresada.</span>
      </div>
      }
    </div>
  </div>
</div>
